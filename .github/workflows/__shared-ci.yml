name: Internal - Common Continuous Integration tasks

on:
  workflow_call:
    outputs:
      build-artifact-id:
        description: Build artifact containing compiled packages and documentation
        value: ${{ jobs.continuous-integration.outputs.build-artifact-id }}
      package-tarball-artifacts:
        description: Validated tarball artifact IDs keyed by package directory
        value: ${{ jobs.continuous-integration.outputs.package-tarball-artifacts }}

permissions: {}

jobs:
  continuous-integration:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@edb594602aad107aa3917911341be04503e9e6bd # PR #563
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      package: "true"
      build: |
        {
          "commands": ["build:ci", "storybook:build", "docs:build"],
          "artifact": ["packages/**/lib", "build", "packages/**/docs"]
        }
      test: |
        { "coverage": "codecov" }
